[book]
authors = ["Nick Mathewson"]
language = "en"
multilingual = false
src = "src"
title = "Advanced Rust macros with derive-deftly"

[output.html]

[output.linkcheck]
warning-policy = "error"
# We effectively disable checking link destinations by excluding
# all links (`.*`).
#
# We're only using linkcheck to validate that reference-style links have *some*
# definition in the markdown, ensuring that *some* link will be generated. We
# validate that those links are correct using a separate tool (`maint/check-mdbook-links`)
exclude = [ '.*' ]

# The output directories chosen by mdbook depend on whether there
# is only one `[output]`, or several (!)
# This is not documented (!!)
#
# I discovered it here
#    https://github.com/Michael-F-Bryan/mdbook-linkcheck/blob/bffff60e6de6f755fab9dfd6ecc3f6cf872c633d/README.md?plain=1#L56
#
# Add a dummy `[output]` entry so that if we change the number outputs,
# things don't move about.
[output.null]
command = "true"
