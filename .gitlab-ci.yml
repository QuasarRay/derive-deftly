
stages:
  - XXXX
  - test
  - comprehensive

default:
  before_script:
    # Print version info for debugging
    - rustc --version ||true
    - cargo --version ||true
    # See tests/stderr.rs
    - export STDERRTEST_CARGO_OPTIONS=--locked

image: "rust:bookworm"

# Running tests without --workspace is useful because that way cargo
# won't add features to our dependencies that we didn't actually enable
# *in the derive-deftly or derive-deftly-macros crates*.
cargo-check-deps:
  stage: test
  script:
    - cargo check --locked --verbose --all-features

cargo-check:
  stage: test
  script:
    - cargo check --locked --workspace --verbose --all-features

cargo-check-minfeatures:
  stage: test
  script:
    - cargo check --locked --verbose --no-default-features --features=minimal-1

cargo-fmt:
  stage: test
  script:
    - rustup component add rustfmt
    - maint/rustfmt --verbose --check

maint-check-bizarre:
  stage: test
  script:
    - maint/update-bizarre --check

maint-check-test-deps:
  stage: test
  script:
    - apt-get -y update
    - apt-get -y install libtoml-perl git
    - maint/check-test-deps

# Check for FIXMEs.  This is in "comprehensive" so you can sabotage
# the CI, but still get it all to run - useful for iterating through CI.
maint-check-todos:
  stage: comprehensive
  dependencies: []
  script:
    - apt-get -y update
    - apt-get -y install libtoml-perl git
    - maint/check-blocking-todos

# Warning-only checks
check-doc-tocs:
  stage: test
  allow_failure: true
  script:
    - maint/update-tocs --check

# Warning-only checks
check-keywords-documented:
  stage: test
  allow_failure: true
  script:
    - maint/check-keywords-documented >&2

# Actual tests
#
# We pin to a particular cargo-expand:
#   https://github.com/dtolnay/cargo-expand/issues/179
cargo-test:
  stage: test
  # See "Using the proper Nightly Rust" in tests/tests.rs
  image: rustlang/rust@sha256:02a6b6deed8307c39fbd3124bd2f3806c9420f92031bc84f6035045458f876f1
  script:
    - ./maint/via-cargo-install-in-ci cargo-expand --locked --version=1.0.80 --features=prettyplease
    - maint/cargo-test-locked --workspace --verbose --all-features -- --skip directly::check_examples
  cache:
    when: 'always'
    paths:
      - cache/*

# Warning only, since this approach may be fragile and also the 
# testing machinery (particularly the thing that parses reference.md
# is rather baroque and ad-hco).
check-doc-examples:
  stage: comprehensive
  image: rustlang/rust@sha256:02a6b6deed8307c39fbd3124bd2f3806c9420f92031bc84f6035045458f876f1
  allow_failure: true
  script:
    - maint/cargo-test-locked -p derive-deftly-tests --verbose --all-features -- --nocapture directly::check_examples

# Test every commit
#
# This may not work properly if we change the Nightly image version,
# or the cargo expand version.  Workaround: I believe doing that as
# the only commit in an MR will still work.
every-commit:
  stage: XXXX
  image: rustlang/rust@sha256:02a6b6deed8307c39fbd3124bd2f3806c9420f92031bc84f6035045458f876f1
  script:
    - printenv | sort
    - ./maint/via-cargo-install-in-ci cargo-expand --locked --version=1.0.67 --features=prettyplease
    - maint/for-every-commit maint/cargo-test-locked --workspace --verbose --all-features -- --skip directly::check_examples
  cache:
    when: 'always'
    paths:
      - cache/*

cargo-test-minfeatures:
  stage: comprehensive
  image: rustlang/rust@sha256:02a6b6deed8307c39fbd3124bd2f3806c9420f92031bc84f6035045458f876f1
  script:
    - maint/cargo-test-locked  -p derive-deftly-tests --no-default-features --features=derive-deftly-tests/recent -- --skip directly::check_examples

# Test on Stable Rust
#
# We don't enable the ui and macrotest fatures in derive-deftly-tests, since
# we think their output might reasonably vary (in detail) when the with
# compiler changes.  But we do enable the "recent" feature to test even new
# features.
stable:
  stage: comprehensive
  script:
    - maint/cargo-test-locked --workspace --verbose --features=derive-deftly-tests/recent,derive-deftly-tests/full

stable-minfeatures:
  stage: comprehensive
  script:
    - maint/cargo-test-locked  -p derive-deftly-tests --no-default-features --features=derive-deftly-tests/recent

# Test that users who like clippy don't get spurious warnings.
# (eg, that the #27 lint avoidance technique hasn't regressed).
stable-user-clippy:
  stage: comprehensive
  script:
    - rustup component add clippy
    - cargo clippy --locked -p pub-a -p pub-b --no-deps --all-features -- -Dwarnings

# Check that the docs build
cargo-doc:
  stage: comprehensive
  script:
    - cargo doc --locked --workspace --verbose --features=full

# Check that the complete docs build without any warnings
cargo-doc-all:
  stage: comprehensive
  allow_failure: true
  script:
    - apt-get update
    - apt-get -y install jq
    - cargo doc --locked --workspace --verbose --features=full --document-private-items --message-format=json >rustdoc.json
    - jq --raw-output '. | select(.message.level) | .message.rendered' <rustdoc.json |tee rustdoc.errors
    - test ! -s rustdoc.errors

# Check that our principal crate doesn't have broken links
check-doc-links:
  stage: comprehensive
  allow_failure: true
  script:
    - apt-get update
    - apt-get -y install linklint
    - maint/check-doc-links

# Test our MSRV and Cargo.toml minimal versions
#
# We don't enable any of the optional fatures in derive-deftly-tests.
minimal-versions:
  stage: comprehensive
  image: "rust:1.56.0"
  script:
    - mv Cargo.lock.minimal Cargo.lock
    - maint/cargo-test-locked +1.56.0 --workspace --no-default-features --features=derive-deftly-tests/full

minimal-versions-minfeatures:
  stage: comprehensive
  image: "rust:1.56.0"
  script:
    - mv Cargo.lock.minimal Cargo.lock
    - maint/cargo-test-locked +1.56.0 -p derive-deftly-tests --no-default-features

cargo-test-dprint:
  stage: comprehensive
  script:
    - RUSTFLAGS="--cfg derive_deftly_dprint" DERIVE_DEFTLY_DPRINT=1 maint/cargo-test-locked --workspace --all-features -- run_pass_expand 3>&2 2>&1 1>&3 3>&- | tee dprint-output
    - grep -m1 'define_derive_deftly! input start' dprint-output
