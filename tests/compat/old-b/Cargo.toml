# See tests/compat/README.md
[package]
name = "old-b"
version = "0.0.1"
edition = "2018"
license="MIT"
authors=["Ian Jackson <ijackson@chiark.greenend.org.uk>",
         "and the contributors to Rust derive-deftly"]
description="compat testing crates - old part B"
publish = false

[features]
default = ["skip_imported_driver"]
skip_imported_driver = []

[dependencies]
pub-a = { path = "../../pub-export/pub-a", version = "0.0.1" }
# After 0.11.0 is released, remove the `path`, don't bump the version!
derive-deftly = { version = "=0.11.0", path = "../../.." }

[lib]
path = "old-b.rs"
doc = false
doctest = false
