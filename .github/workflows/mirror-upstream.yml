name: Mirror upstream GitLab repository

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/mirror-upstream.yml"

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://gitlab.torproject.org/Diziet/rust-derive-deftly.git
  UPSTREAM_DEFAULT_BRANCH: main
  EXACT_DEFAULT_MIRROR_BRANCH: upstream-main

jobs:
  mirror:
    # The initial workflow commit may be created by a GitHub App.  Commits made
    # by this workflow use github-actions[bot]; ignore those push events to
    # avoid a self-triggering loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out mirror control commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Save mirror workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirror-control"
          cp .github/workflows/mirror-upstream.yml \
             "$RUNNER_TEMP/mirror-control/mirror-upstream.yml"

      - name: Mirror upstream branches, tags, and history
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          MIRROR_DIR="$RUNNER_TEMP/upstream.git"

          rm -rf "$MIRROR_DIR"
          git clone --mirror "$UPSTREAM_URL" "$MIRROR_DIR"
          cd "$MIRROR_DIR"

          upstream_main_ref="refs/heads/$UPSTREAM_DEFAULT_BRANCH"
          upstream_main_sha="$(git rev-parse "$upstream_main_ref")"
          echo "Upstream $UPSTREAM_DEFAULT_BRANCH: $upstream_main_sha"

          # Keep an exact, automation-free pointer to upstream's default branch.
          git push --force "$TARGET_URL" \
            "$upstream_main_ref:refs/heads/$EXACT_DEFAULT_MIRROR_BRANCH"

          # Mirror every other upstream branch under the same branch name.
          mapfile -t upstream_branches < <(
            git for-each-ref --format='%(refname:strip=2)' refs/heads
          )

          for branch in "${upstream_branches[@]}"; do
            if [[ "$branch" == "$UPSTREAM_DEFAULT_BRANCH" ]]; then
              continue
            fi
            git push --force "$TARGET_URL" \
              "refs/heads/$branch:refs/heads/$branch"
          done

          # Remove mirrored branches that were deleted upstream.  Preserve the
          # local control branch and the exact default-branch mirror.
          mapfile -t target_branches < <(
            git ls-remote --heads "$TARGET_URL" |
              awk '{ sub("refs/heads/", "", $2); print $2 }'
          )

          for branch in "${target_branches[@]}"; do
            if [[ "$branch" == "main" ||
                  "$branch" == "$EXACT_DEFAULT_MIRROR_BRANCH" ]]; then
              continue
            fi

            found=false
            for upstream_branch in "${upstream_branches[@]}"; do
              if [[ "$branch" == "$upstream_branch" ]]; then
                found=true
                break
              fi
            done

            if [[ "$found" == false ]]; then
              git push "$TARGET_URL" ":refs/heads/$branch"
            fi
          done

          # Mirror tags exactly, including deletions.
          git push --force --prune "$TARGET_URL" \
            'refs/tags/*:refs/tags/*'

          echo "UPSTREAM_MAIN_SHA=$upstream_main_sha" >> "$GITHUB_ENV"

      - name: Verify recursive submodules
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/upstream-worktree"
          rm -rf "$WORK_DIR"
          git clone "$UPSTREAM_URL" "$WORK_DIR"
          cd "$WORK_DIR"
          git checkout "$UPSTREAM_DEFAULT_BRANCH"

          # No-op when the repository has no submodules.  If it does, this
          # checks out every nested submodule recursively.
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Keep automation commit on GitHub main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          current_parent="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [[ "$current_parent" == "$UPSTREAM_MAIN_SHA" ]]; then
            echo "GitHub main is already based on current upstream main."
            exit 0
          fi

          CONTROL_FILE="$RUNNER_TEMP/mirror-control/mirror-upstream.yml"
          WORK_DIR="$RUNNER_TEMP/control-main"
          rm -rf "$WORK_DIR"

          git clone "$UPSTREAM_URL" "$WORK_DIR"
          cd "$WORK_DIR"
          git checkout "$UPSTREAM_DEFAULT_BRANCH"

          mkdir -p .github/workflows
          cp "$CONTROL_FILE" .github/workflows/mirror-upstream.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/mirror-upstream.yml
          git commit --no-gpg-sign -m "chore: keep automatic upstream mirror"

          # main contains all upstream history plus exactly one local automation
          # commit. upstream-main remains the exact upstream main pointer.
          git push --force "$TARGET_URL" HEAD:refs/heads/main
